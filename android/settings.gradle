// android/settings.gradle (Groovy 脚本)
// --------------------------------------------------
// 最终修复版 v4：
// 1. 保持 Groovy，保持硬编码 C:/flutter
// 2. (关键) 把 Kotlin 插件版本从 2.0.21 降回 1.9.24，以匹配 AGP 8.6.1
// 3. 保持 PREFER_PROJECT 避免仓库冲突
// --------------------------------------------------

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }

    // 2. 从 *环境变量* 读取 SDK 路径
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")
    if (flutterSdkPath == null) {
        flutterSdkPath = "C:/flutter" // 回退到硬编码
    }

    // 3. 引入 Flutter 的 Gradle 插件
    includeBuild "$flutterSdkPath/packages/flutter_tools/gradle"
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    // 保持 AGP 8.6.1
    id "com.android.application" version "8.6.1" apply false

    // ★ 关键：必须换回 1.9.24 才能和 AGP 8.6.1 兼容 ★
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

dependencyResolutionManagement {
    // ★ 关键：保持 PREFER_PROJECT 以避免仓库冲突 ★
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}

rootProject.name = "swaply"
include ":app"