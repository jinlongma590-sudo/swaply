name: iOS App Store Build

on:
  workflow_dispatch:

jobs:
  build_ios:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Certificates & Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_CER_BASE64: ${{ secrets.BUILD_CERTIFICATE_CER_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: "temporary_password"
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          CERTIFICATE_CER_PATH=$RUNNER_TEMP/build_certificate.cer
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 1. 解码 Secret 到文件 (确保所有 Base64 都是最新的)
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_CERTIFICATE_CER_BASE64" | base64 --decode -o $CERTIFICATE_CER_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # 2. 创建钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 3. 导入 Apple 中级证书 & CER
          curl -o $RUNNER_TEMP/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k $KEYCHAIN_PATH -T /usr/bin/codesign
          security import $CERTIFICATE_CER_PATH -k $KEYCHAIN_PATH -T /usr/bin/codesign

          # 4. 【核心修复】根据 P12_PASSWORD 状态导入 P12
          if [ -z "$P12_PASSWORD" ]; then
              echo "P12 password is empty or not set. Importing without password..."
              security import $CERTIFICATE_PATH -A -f pkcs12 -k $KEYCHAIN_PATH
          else
              echo "P12 password exists. Importing with password."
              security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -f pkcs12 -k $KEYCHAIN_PATH
          fi

          # 5. 防止签名工具卡住
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 验证 (这次必看日志，确保这里显示 1 valid identity)
          security find-identity -v -p codesigning $KEYCHAIN_PATH

          # 6. 安装描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Fix Xcode Signing Style
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          UUID=$(strings "$PP_PATH" | grep -A1 "<key>UUID</key>" | tail -n1 | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          TEAM_ID=$(strings "$PP_PATH" | grep -A1 "<key>TeamIdentifier</key>" | tail -n2 | grep "string" | sed -e 's/.*<string>//' -e 's/<\/string>.*//')
          echo "Using Official Profile UUID: $UUID"
          echo "Using Team ID: $TEAM_ID"
          
          PBX_PATH="ios/Runner.xcodeproj/project.pbxproj"
          
          # 1. 强制将 Developer 改为 Distribution
          sed -i '' 's/iPhone Developer/iPhone Distribution/g' "$PBX_PATH"
          sed -i '' 's/Apple Development/iPhone Distribution/g' "$PBX_PATH"
          
          # 2. 强制 Manual 签名
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX_PATH"
          
          # 3. 指定 UUID & Team ID
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"$UUID\";/g" "$PBX_PATH"
          sed -i '' "/PRODUCT_NAME = .*/a\\
          PROVISIONING_PROFILE_SPECIFIER = \"$UUID\";" "$PBX_PATH"
          sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = $TEAM_ID;/g" "$PBX_PATH"

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update

      - name: Build IPA
        run: |
          # 🔥 最终修复：添加强制链接参数 -all_load 和 -ObjC (解决链接器错误)
          flutter build ipa --release --export-method=app-store --verbose -- \
            -xcode-build-settings="OTHER_LDFLAGS=-all_load -ObjC"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: swaply-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 1