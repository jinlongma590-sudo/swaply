name: swaply
description: A marketplace app for Zimbabwe
publish_to: 'none'
version: 1.0.1+118

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 基础
  intl: 0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_screenutil: ^5.9.3
  uuid: ^3.0.7
  flutter_local_notifications: ^17.1.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  cupertino_icons: ^1.0.6
  app_links: ^6.4.1

  # 媒体/文件
  image_picker: ^1.0.7
  photo_view: ^0.14.0
  file_picker: ^10.3.3
  flutter_image_compress: ^2.1.0

  # 分享
  share_plus: ^12.0.0
  http: ^1.2.0
  package_info_plus: ^8.0.0

  # Supabase / OAuth
  supabase_flutter: ^2.10.3
  supabase: ^2.4.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  flutter_custom_tabs: ^2.4.0

  cross_file: any
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
dependency_overrides:
    path: 1.9.0

flutter_launcher_icons:
  android: "adaptive"
  ios: false
  image_path_android: assets/ic_launcher_foreground_432.png
  adaptive_icon_foreground: assets/ic_launcher_foreground_432.png
  adaptive_icon_background: "#1877F2"
  adaptive_icon_monochrome: assets/ic_launcher_foreground_432.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/trending.png
    - assets/icons/vehicles.png
    - assets/icons/property.png
    - assets/icons/beauty_personal_care.png
    - assets/icons/jobs.png
    - assets/icons/babies_kids.png
    - assets/icons/services.png
    - assets/icons/leisure_activities.png
    - assets/icons/repair_construction.png
    - assets/icons/home_furniture_appliances.png
    - assets/icons/pets.png
    - assets/icons/electronics.png
    - assets/icons/phones_tablets.png
    - assets/icons/seeking_work_cvs.png
    - assets/icons/fashion.png
    - assets/icons/food_agriculture_drinks.png

    - assets/images/
    - assets/images/trending_items/
    - assets/images/trending_items/item1/
    - assets/images/trending_items/item1/1.jpg
    - assets/images/trending_items/item2/
    - assets/images/trending_items/item2/1.jpg
    - assets/images/trending_items/item3/
    - assets/images/trending_items/item3/1.jpg

flutter_intl:
  enabled: false

# ✅ 新增：flutter_native_splash 配置
flutter_native_splash:
  color: "#1877F2"
  ios: true
  android: true
  ios_content_mode: center
  fullscreen: false
